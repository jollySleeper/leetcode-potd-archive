name: Update POTD archive

on:
  schedule:
    # 01:15 UTC on the 1st, with a retry on the 2nd. LeetCode publishes each
    # daily at 00:00 UTC, so the previous month is complete by then. GitHub can
    # delay or drop scheduled runs; the 2nd is a no-op when the 1st succeeded.
    - cron: "15 1 1,2 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "previous-month, backfill, or fetch"
        type: choice
        options:
          - previous-month
          - backfill
          - fetch
        default: previous-month
      year:
        description: "Year, required when mode is fetch"
        required: false
        type: string
      month:
        description: "Month 1-12, required when mode is fetch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: potd-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch and build
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
          MONTH: ${{ inputs.month }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then MODE=previous-month; fi
          case "$MODE" in
            backfill) python3 scripts/update_potd.py backfill ;;
            fetch) python3 scripts/update_potd.py fetch --year "$YEAR" --month "$MONTH" ;;
            *) python3 scripts/update_potd.py previous-month ;;
          esac
      - name: Commit and push
        id: commit
        run: |
          git add archive public/challenges.json
          if git diff --cached --quiet; then
            echo "No archive changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          months=$(git diff --cached --name-only -- 'archive/*/*.json' \
            | sed -E 's#^archive/[0-9]{4}/([0-9]{4}-[0-9]{2})\.json$#\1#')
          count=$(printf '%s\n' "$months" | grep -c . || true)
          if [ "$count" -eq 1 ]; then
            msg="chore(data): update archive for $months"
          elif [ "$count" -gt 1 ]; then
            msg="chore(data): update archive for $count months"
          else
            msg="chore(data): rebuild generated archive files"
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$msg"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
